name: Build and deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 22 * * 6"   # Sunday 07:30 KST — after the weekly 과세환율 is published
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jinja2
      - name: Refresh weekly customs FX
        run: |
          # UNIPASS sometimes refuses non-Korean IPs; never let a fetch failure block the deploy.
          python scripts/fetch_fx.py || echo "fx fetch failed; keeping committed data/fx.json"
          if ! git diff --quiet data/fx.json; then
            git config user.name "fx-bot" && git config user.email "fx-bot@users.noreply.github.com"
            git add data/fx.json && git commit -m "fx: weekly 과세환율 $(date -u +%F)" && git push
          fi
      - run: python scripts/build.py --base / --origin https://jikguse.com --cname jikguse.com
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jinja2
      - run: python scripts/build.py
      - run: python scripts/indexnow.py || true
